<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d5c39">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kungsleden">
<link rel="manifest" href="manifest.json">

<body>
<header>
  <h1>Kungsleden Navigator</h1>
  <span class="gps"><span class="dot off" id="gpsdot"></span><span id="gpstxt">no GPS</span></span>

<main>

    <button data-p="info">Info</button>
  </nav>

  <section class="panel active" id="p-now"></section>
  <section class="panel" id="p-plan"></section>
  <section class="panel" id="p-info"></section>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
