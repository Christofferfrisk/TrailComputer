; Offline ESP32 hiking trail computer — DFRobot FireBeetle 2 ESP32-E
; Build: pio run    Upload: pio run -t upload    Monitor: pio device monitor

[platformio]
; Keep the build tree (~230 MB) and library cache (~80 MB) OUT of this
; Nextcloud-synced folder. Both go under C:/pio-builds instead.
build_dir = C:/pio-builds/trail-computer
libdeps_dir = C:/pio-builds/trail-computer/libdeps

[env]
platform = espressif32
board = dfrobot_firebeetle2_esp32e
framework = arduino
monitor_speed = 115200

[env:firebeetle2_esp32e]
monitor_filters = esp32_exception_decoder

build_flags =
    -DCORE_DEBUG_LEVEL=2

; main firmware: everything except the standalone test mains
build_src_filter = +<*> -<smoketest.cpp> -<wifitest.cpp>

lib_deps =
    zinggjm/GxEPD2@^1.6.0
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
    mikalhart/TinyGPSPlus@^1.0.3
    mprograms/QMC5883LCompass@^1.2.3

; Bare-board connectivity check: pio run -e smoketest -t upload
[env:smoketest]
build_src_filter = +<smoketest.cpp>

; Config-portal GUI test (no peripherals): pio run -e wifitest -t upload
[env:wifitest]
build_src_filter = +<wifitest.cpp> +<config_portal.cpp> +<route_util.cpp> +<geo.cpp> +<power.cpp> +<state.cpp>
